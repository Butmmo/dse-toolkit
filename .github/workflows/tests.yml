name: Toolkit tests

# Runs every tests/test_*.py on each push and pull request. Nothing real is contacted: the tests replace mail servers, Citadel and Google with fakes.
# The tests were written on Windows and have gone green on Linux here, so a failure now fails the commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the tests import
        run: pip install -r requirements.txt openpyxl pillow
      - name: Run every test file
        run: |
          fail=0
          for f in tests/test_*.py; do
            echo "== $f"
            if ! python "$f" > /tmp/out.txt 2>&1; then
              fail=1
              grep -E "FAIL|Error|Traceback" /tmp/out.txt | head -8
            fi
          done
          exit $fail
